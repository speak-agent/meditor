name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-sources:
    name: Public sources and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_repository.py
      - run: git diff --check

  native-core:
    name: Native core and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Restore build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry
            ~/.mcpp/git
          key: meditor-${{ runner.os }}-${{ runner.arch }}-mcpp-2026.10.21.1-${{ hashFiles('**/mcpp.toml', 'mcpp.lock') }}
          restore-keys: meditor-${{ runner.os }}-${{ runner.arch }}-mcpp-2026.10.21.1-
      - name: Install verified compiler driver
        run: python scripts/setup_tools.py --directory "${{ runner.temp }}/meditor-tools"
      - name: Build native CLI and fixture tool
        run: mcpp build
      - name: Test independent document and platform packages
        run: mcpp test -p meditor-document -p meditor-platform
      - name: Exercise document and tool protocols through meditor
        run: python scripts/run_cli_tests.py
