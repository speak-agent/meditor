[package]
name = "meditor-distribution"
version = "0.0.1"
standard = "c++23"
license = "GPL-3.0-only"
description = "Validated payload placement and embedded resources for meditor application builds"

[lib]
path = "src/distribution.cppm"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies.nlohmann]
json = "=3.12.0"
