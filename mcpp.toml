[workspace]
members = ["modules/document", "modules/platform", "modules/application", "apps/gui"]

[workspace.package]
mcpp = ">=2026.10.10.1"

[package]
name = "meditor"
version = "0.0.1"
standard = "c++23"
description = "A modern editor for mcpp and C++ Modules"
license = "MIT"
repo = "https://github.com/speak-agent/meditor"

[dependencies]
meditor-application = { path = "modules/application" }

[dependencies.nlohmann]
json = "=3.12.0"

[targets.meditor]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cpp"]

[workspace.toolchain]
default = "llvm@23.1.3"

[targets.meditor-test-tool]
kind = "bin"
main = "tests/support/tool.cpp"
