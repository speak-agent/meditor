[workspace]
members = ["modules/document", "modules/platform", "modules/application", "modules/distribution", "apps/gui"]

[workspace.package]
mcpp = ">=2026.10.10.1"

[package]
name = "meditor"
version = "0.0.1"
standard = "c++23"
description = "A modern editor for mcpp and C++ Modules"
license = "MIT"
repo = "https://github.com/speak-agent/meditor"

[dependencies]
meditor-application = { path = "modules/application" }

[dependencies.nlohmann]
json = "=3.12.0"

[targets.meditor]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cpp"]
macos_deployment_target = "14.0"

[workspace.toolchain]
default = "llvm@23.1.3"
bootstrap = "llvm@23.1.3"

[workspace.target.aarch64-linux-android]
toolchain = "android-ndk@30.0.16248370"

[workspace.target.x86_64-linux-android]
toolchain = "android-ndk@30.0.16248370"

[workspace.target.wasm32-emscripten]
toolchain = "emsdk@6.0.9"

[features]
test-support = []

[targets.meditor-test-tool]
kind = "bin"
required_features = ["test-support"]
main = "tests/support/tool.cpp"

[build-dependencies]
meditor-distribution = { path = "modules/distribution" }

[target.'cfg(any(os = "macos", os = "ios"))'.dependencies]
llvm.libcxx = "=22.1.8.3"
