[package]
name = "meditor-gui"
version = "0.0.1"
standard = "c++23"
license = "GPL-3.0-only"
platforms = ["linux", "windows", "macos", "android", "ios", "emscripten"]

[dependencies]
meditor-document = { path = "../../modules/document" }
meditor-application = { path = "../../modules/application" }
huxerui.huxerui = { git = "https://github.com/Sunrisepeak/HuxerUI.git", branch = "meditor" }

[target.'cfg(any(os = "windows", os = "macos", all(os = "linux", not(env = "android"))))'.dependencies]
meditor = { path = "../..", artifacts = ["meditor"] }

[dependencies.nlohmann]
json = "=3.12.0"

[targets.meditor-gui]
kind = "app"
main = "src/main.cpp"
windows_subsystem = "windows"

[build]
sources = []
macos_deployment_target = "14.0"
ios_deployment_target = "15.0"

[target.'cfg(any(os = "macos", os = "ios"))'.dependencies]
llvm.libcxx = "=22.1.8.3"

[target.'cfg(os = "emscripten")'.abi]
exceptions = true

[target.x86_64-linux-android]
min_api_level = 23

[target.aarch64-linux-android]
min_api_level = 23

[dev-dependencies]
meditor-test-fixture = { path = "../../tests/support" }
huxerui.huxerui-testing = { git = "https://github.com/Sunrisepeak/HuxerUI.git", branch = "meditor" }
